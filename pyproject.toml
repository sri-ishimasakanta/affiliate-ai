[project]
name = "affiliate-ai"
version = "0.1.0"
description = "アフィリエイト記事の生成・運用を支援するAIプラットフォーム"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "google-ads>=31.4.0",
    "httpx>=0.28.1",
    "mistune>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
# Alembic が自動生成するマイグレーションスクリプトは lint 対象外にする。
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
